version: 2
# Each ecosystem gets one patch/minor group and one major group (pip gets a
# single group, see below), so Dependabot opens at most two PRs per
# ecosystem a week. When a major breaks the build, add an ignore for it
# instead of leaving the major group red.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # typescript-eslint 8 supports TypeScript >=4.8.4 <6.1.0, so the
      # frontend stays on TypeScript 6 (pinned back from 7 in 3746bc4).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One group with no update-types filter. These requirements are ranges
    # with no lockfile, so Dependabot can't tell a patch from a major
    # ("update X requirement to permit the latest version"). An update-types
    # filter matches none of them, and each one opens its own PR.
    groups:
      pip:
        patterns:
          - "*"
    ignore:
      # selectolax 1.0 removed the `selectolax.parser` backend the connectors
      # import; pyproject.toml caps it below 1.0 (closed #160).
      - dependency-name: selectolax
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # Stay on python:3.14-slim until selectolax (capped <1.0) ships cp315
      # wheels; on 3.15 the image would compile it from sdist (see #176).
      - dependency-name: python
        versions:
          - ">= 3.15"
