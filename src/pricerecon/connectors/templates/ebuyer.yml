name: ebuyer
source_type: retailer
base_url: https://www.ebuyer.com
search_url: https://www.ebuyer.com/searchresults?descriptionfilter={query}
selectors:
  card: .product-line-card
  title: .product-line-card__description-name
  price: .product-line-card__price-current, .product-line-card__price
  url: a[data-product-line-item-name-value]
  stock: .product-line-card__description-low-stock-message
  image: img[data-product-line-item-image]
  id: .product-line-card
# Direct HTTP is the verified working access lane for this endpoint.
use_flare_solverr: false
category: gpu
